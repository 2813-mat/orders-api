services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: orders
      MYSQL_USER: orders
      MYSQL_PASSWORD: orders
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20
    volumes: [mysql_data:/var/lib/mysql]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/orders/protocol/openid-connect/certs
    command: sh -c "node dist/database/run-migrations.js && node dist/database/seeds/run-seed.js && node dist/main.js"
    ports: ["3000:3000"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Healthy = migrations and seed done and MySQL reachable (GET /health).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Publishes committed outbox events to BullMQ. Same image, other entrypoint.
  # Waits for a healthy API, i.e. for the migrations to have run.
  relay:
    build: .
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    command: node dist/relay.js
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }

  # Consumes the orders queue. Scales out: docker compose up --scale worker=3
  worker:
    build: .
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    command: node dist/worker.js
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fixes the token issuer to the public URL, no matter whether the token was
      # requested from the host (localhost:8080) or from inside the network (keycloak:8080).
      KC_HOSTNAME: http://localhost:8080
      # Lets the API reach Keycloak via keycloak:8080 (JWKS) while the issuer stays public.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # The image has no curl: plain HTTP over bash /dev/tcp on the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
